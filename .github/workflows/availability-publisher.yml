name: Availability publisher safety
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile launcher and UI
        run: python -m py_compile availability_launcher.py availability_sync.py availability_ui.py main.py
      - name: Synthetic bridge and outbox tests
        run: python -m unittest discover -s tests -p "test_availability*.py" -v
      - name: Browser key security boundary
        run: python -m unittest discover -s tests -p "test_security_cloud_key.py" -v
      - name: Existing cloud sync tests (no live service)
        run: python -m unittest discover -s tests -p "test_cloud_sync.py" -v
