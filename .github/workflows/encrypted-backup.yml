name: Optional encrypted backup
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backup:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-backup.txt
      - run: python -m unittest discover -s tests -p "test_encrypted_backup.py" -v
